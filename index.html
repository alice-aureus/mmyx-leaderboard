<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aureus Star Search — Live Leaderboard</title>
<style>
  :root {
    --gold:#E8B84B; --gold-deep:#8A6D1F; --gold-soft:#FBF6E9; --gold-pill:#FCEFCB;
    --ink:#2B2B2B; --grey:#6B6B6B; --line:#EFE6CE; --white:#FFFFFF;
    --sans:'Poppins','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--sans); background:var(--white); color:var(--ink); min-height:100vh; padding:0 0 60px; }
  .topbar { height:6px; background:var(--gold); width:100%; }
  .wrap { max-width:780px; margin:0 auto; padding:0 20px; }

  .head { text-align:center; padding:42px 0 8px; }
  .eyebrow { font-size:13px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--gold-deep); margin-bottom:14px; }
  h1 { font-size:42px; font-weight:800; color:var(--ink); line-height:1.05; letter-spacing:-1px; }
  h1 em { font-style:italic; color:var(--gold-deep); }
  .sub { font-size:15px; color:var(--grey); margin-top:14px; }

  .status { display:flex; align-items:center; justify-content:center; gap:9px; font-size:13px; color:var(--grey); margin:22px 0 28px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#4caf50; }
  .dot.loading { background:var(--gold); animation:pulse 1s infinite; }
  .dot.error { background:#C0392B; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .refresh-btn { background:var(--gold); color:var(--ink); border:none; cursor:pointer; font-family:var(--sans); font-weight:700; font-size:12px; padding:7px 18px; border-radius:999px; margin-left:8px; transition:filter .15s; }
  .refresh-btn:hover { filter:brightness(.95); }

  .boards { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media(max-width:640px){ .boards { grid-template-columns:1fr; } }
  .board { background:var(--white); border:1px solid var(--line); border-radius:22px; overflow:hidden; box-shadow:0 10px 28px rgba(138,109,31,.07); }
  .board-head { padding:18px 20px 14px; text-align:center; background:var(--gold-soft); border-bottom:1px solid var(--line); }
  .board-head .pill { display:inline-block; background:var(--gold); color:var(--ink); font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:5px 16px; border-radius:999px; margin-bottom:10px; }
  .board-head h2 { font-size:22px; font-weight:800; color:var(--ink); }
  .board-head h2 em { font-style:italic; color:var(--gold-deep); }
  .board-head p { font-size:12px; color:var(--grey); margin-top:3px; }
  .board-body { padding:12px 14px 16px; }

  .row { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:14px; margin-bottom:6px; background:var(--white); border:1px solid var(--line); }
  .row.top1 { background:var(--gold-soft); border-color:var(--gold); }
  .pos { width:28px; height:28px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; background:var(--gold-pill); color:var(--gold-deep); }
  .row.top1 .pos { background:var(--gold); color:var(--ink); }
  .row.top2 .pos { background:#E3E3E3; color:#666; }
  .row.top3 .pos { background:#F0DBB0; color:var(--gold-deep); }
  .nm { flex:1; font-weight:600; font-size:14.5px; color:var(--ink); }
  .vl { font-weight:800; font-size:19px; color:var(--gold-deep); }

  .empty { text-align:center; color:var(--grey); font-size:13px; padding:34px 10px; }
  .err-box { background:#FDF3F2; border:1px solid #E8C0BB; border-radius:14px; padding:18px; font-size:13px; color:#8B2E26; line-height:1.5; margin-top:16px; }
  .foot { text-align:center; font-size:12px; color:var(--grey); margin-top:34px; line-height:1.7; }
  @media(prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="topbar"></div>
<div class="wrap">
  <div class="head">
    <div class="eyebrow">AUREUS · MMYX AMBASSADORS</div>
    <h1>Live Leaderboard</h1>
  </div>
  <div class="status">
    <span class="dot loading" id="statusDot"></span>
    <span id="statusText">Loading latest numbers…</span>
    <button class="refresh-btn" onclick="loadData()">Refresh</button>
  </div>
  <div class="boards">
    <div class="board">
      <div class="board-head">
        <h2>📸 Most Posts</h2>
        <p>Ranked by total videos posted</p>
      </div>
      <div class="board-body" id="postsBoard"><div class="empty">Loading…</div></div>
    </div>
    <div class="board">
      <div class="board-head">
        <h2>🏫 Top Centre</h2>
        <p>Ranked by total posts across the centre</p>
      </div>
      <div class="board-body" id="centreBoard"><div class="empty">Loading…</div></div>
    </div>
  </div>
  <div id="errZone"></div>
  <div class="foot">
    Music Makes You _____ | Aureus Interactive
  </div>
</div>
<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS1-uTNo8pZLJLzjqy0Iwq_u7RtW65zygFFsphHxPFhocF8N166k01FlKdJod30WrCmFV2gdLimk8OT/pub?output=csv';
  function parseCSV(text){const rows=[];let row=[],field='',q=false;
    for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];
      if(q){if(c==='"'&&n==='"'){field+='"';i++;}else if(c==='"'){q=false;}else{field+=c;}}
      else{if(c==='"'){q=true;}else if(c===','){row.push(field);field='';}
        else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
        else if(c==='\r'){}else{field+=c;}}}
    if(field.length||row.length){row.push(field);rows.push(row);}
    return rows.filter(r=>r.some(c=>c.trim()!==''));}
  function findCol(h,opts){const l=h.map(x=>x.trim().toLowerCase());
    for(const o of opts){const i=l.indexOf(o);if(i!==-1)return i;}
    for(let i=0;i<l.length;i++){if(opts.some(o=>l[i].includes(o)))return i;}return -1;}
  function setStatus(s,t){document.getElementById('statusDot').className='dot '+(s==='ok'?'':s);
    document.getElementById('statusText').textContent=t;}
  function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function renderBoard(elId,list,key){const el=document.getElementById(elId);el.innerHTML='';
    if(!list.length){el.innerHTML='<div class="empty">No data yet</div>';return;}
    list.forEach((r,i)=>{const d=document.createElement('div');
      let cls='row';if(i===0)cls+=' top1';else if(i===1)cls+=' top2';else if(i===2)cls+=' top3';
      d.className=cls;
      d.innerHTML='<div class="pos">'+(i+1)+'</div><div class="nm">'+esc(r.name)+'</div><div class="vl">'+r[key]+'</div>';
      el.appendChild(d);});}
  async function loadData(){
    setStatus('loading','Loading latest numbers…');
    document.getElementById('errZone').innerHTML='';
    try{
      const res=await fetch(CSV_URL+'&_='+Date.now());
      if(!res.ok)throw new Error('HTTP '+res.status);
      const rows=parseCSV(await res.text());
      if(rows.length<2)throw new Error('Sheet appears empty');
      const h=rows[0];
      const ni=findCol(h,['name','teacher','family']);
      const pi=findCol(h,['posts','post','videos']);
      const ci=findCol(h,['centre','center','branch','location']);
      if(ni===-1)throw new Error('Could not find a Name column');
      const data=rows.slice(1).map(r=>({name:(r[ni]||'').trim(),
        centre:(ci!==-1?(r[ci]||''):'').trim(),
        posts:parseInt((r[pi]||'0').replace(/[^0-9-]/g,''))||0,
      })).filter(d=>d.name);
      renderBoard('postsBoard',[...data].sort((a,b)=>b.posts-a.posts).slice(0,10),'posts');

      // Aggregate posts by centre
      const centreMap={};
      data.forEach(d=>{ if(d.centre){ centreMap[d.centre]=(centreMap[d.centre]||0)+d.posts; } });
      const centres=Object.keys(centreMap).map(k=>({name:k,posts:centreMap[k]})).sort((a,b)=>b.posts-a.posts);
      renderBoard('centreBoard',centres.slice(0,10),'posts');
      const now=new Date();
      setStatus('ok','Live · updated '+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
    }catch(err){
      setStatus('error','Could not load data');
      document.getElementById('errZone').innerHTML='<div class="err-box"><b>Couldn\'t read the sheet.</b><br>Check the Google Sheet is still published to web as CSV with columns Name, Centre and Posts.<br><br>Technical detail: '+esc(err.message)+'</div>';
      document.getElementById('postsBoard').innerHTML='<div class="empty">—</div>';
      document.getElementById('centreBoard').innerHTML='<div class="empty">—</div>';
    }
  }
  loadData();
  setInterval(loadData,60000);
</script>
</body>
</html>
